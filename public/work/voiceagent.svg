<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1530"/>
      <stop offset="1" stop-color="#140c1e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0732d" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#f0732d" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="0.55" stop-color="#f0732d"/>
      <stop offset="1" stop-color="#b9480f"/>
    </radialGradient>
    <style>
      .blob { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blob.b2 { animation-delay: -3s; }
      .bar { fill: url(#wave); animation-name: talk; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; transform-box: fill-box; transform-origin: center; }
      .ring { animation: ring 2.4s cubic-bezier(.2,.6,.3,1) infinite; transform-box: fill-box; transform-origin: center; }
      .ring.r2 { animation-delay: -0.8s; }
      .ring.r3 { animation-delay: -1.6s; }
      .orb { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .say { opacity: 0; animation: say 6s ease-in-out infinite; }
      .say.s2 { animation-delay: -3s; }
      @keyframes talk { 0% { transform: scaleY(0.18) } 35% { transform: scaleY(0.85) } 60% { transform: scaleY(0.4) } 100% { transform: scaleY(1) } }
      @keyframes ring { 0% { transform: scale(1); opacity: 0.7 } 100% { transform: scale(2.3); opacity: 0 } }
      @keyframes bob { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.06) } }
      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.1 } 50% { transform: scale(1.12); opacity: 0.18 } }
      @keyframes say { 0%, 4% { opacity: 0; transform: translateY(6px) } 10%, 44% { opacity: 1; transform: translateY(0) } 50%, 100% { opacity: 0; transform: translateY(-4px) } }
      @media (prefers-reduced-motion: reduce) {
        .blob, .bar, .ring, .orb, .say { animation: none; }
        .say { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <circle class="blob" cx="640" cy="80" r="130" fill="#f0732d" opacity="0.22"/>
  <circle class="blob b2" cx="150" cy="330" r="140" fill="#e45c10" opacity="0.14"/>

  <text x="400" y="88" font-family="DM Serif Display, Georgia, serif" font-style="italic" font-size="56" fill="#f0732d" text-anchor="middle">Voice Agent</text>
  <text x="400" y="122" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#a5a5b0" text-anchor="middle">Multi-lingual real-time AI phone agent</text>

  <!-- waveform -->
  <g>
        <rect class="bar" x="333" y="191.8" width="6" height="92.4" rx="3" style="animation-duration:0.70s;animation-delay:-0.00s"/>
    <rect class="bar" x="318" y="188.2" width="6" height="99.7" rx="3" style="animation-duration:0.77s;animation-delay:-0.13s"/>
