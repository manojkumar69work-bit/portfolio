    <rect class="bar" x="671" y="225.6" width="6" height="24.7" rx="3" style="animation-duration:0.70s;animation-delay:-1.03s"/>
    <rect class="bar" x="686" y="227.4" width="6" height="21.1" rx="3" style="animation-duration:0.77s;animation-delay:-0.06s"/>
  </g>

  <!-- call orb -->
  <circle class="ring" cx="400" cy="238" r="36" fill="none" stroke="#f0732d" stroke-width="2"/>
  <circle class="ring r2" cx="400" cy="238" r="36" fill="none" stroke="#f0732d" stroke-width="2"/>
  <circle class="ring r3" cx="400" cy="238" r="36" fill="none" stroke="#f0732d" stroke-width="2"/>
  <g class="orb">
    <circle cx="400" cy="238" r="38" fill="url(#orb)"/>
    <!-- mic -->
    <rect x="391" y="219" width="18" height="28" rx="9" fill="#fff"/>
    <path d="M384 238 a16 16 0 0 0 32 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="400" y1="254" x2="400" y2="261" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- alternating speech bubbles: caller, then agent -->
  <g class="say" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="15">
    <rect x="94" y="152" width="200" height="34" rx="17" fill="#1e1426" stroke="#4a3352"/>
    <text x="194" y="174" fill="#d9d2e0" text-anchor="middle">Ghar dekhna hai, कब free?</text>
  </g>
  <g class="say s2" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="15">
    <rect x="506" y="152" width="200" height="34" rx="17" fill="#f0732d"/>
    <text x="606" y="174" fill="#fff" text-anchor="middle">Haan ji, kal 11 baje?</text>
  </g>

  <rect x="315" y="322" width="170" height="40" rx="20" fill="#1e1e2e" stroke="#f0732d" stroke-width="2"/>
  <text x="400" y="348" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f0732d" text-anchor="middle">AI PHONE AGENT</text>
</svg>
